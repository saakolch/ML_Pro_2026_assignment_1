apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-perform-api
  labels:
    app: grade-perform-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grade-perform-api
  template:
    metadata:
      labels:
        app: grade-perform-api
    spec:
      containers:
        - name: api
          image: grade-perform:hw1
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-db-credentials
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: grade-perform-config
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
