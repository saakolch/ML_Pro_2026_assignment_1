apiVersion: v1
kind: ConfigMap
metadata:
  name: grade-perform-config
data:
  LOG_LEVEL: "INFO"
  MODEL_PATH: artifact/ridge_model.joblib
  # пусто -> сервис берёт модель из artifact/ridge_model.joblib внутри образа.
  # Когда DAG зарегистрирует модель в MLflow, вернуть "grade_perform"
  MODEL_NAME: ""
  MODEL_ALIAS: "champion"
  MLFLOW_TRACKING_URI: "http://mlflow.grade-mlops.svc.cluster.local:5000"
  