name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: grade-perform}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/grade-perform


    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
  
  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: write}

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses:  docker/setup-buildx-action@v4
      - uses:  docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha 
          cache-to: type=gha,mode=max
  
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, kind]

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=grade-perform:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: build image on the runner
        run: |
          docker build -t "$IMAGE" .

      - name: image to the cluster
        run: |
          docker save "$IMAGE" | docker exec -i kind-control-plane ctr --namespace=k8s.io images import --all-platforms --digests -

      - name: taking secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic ci-db-secrets \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=DATABASE_URL="postgresql://postgres:$DB_PASSWORD@postgres:5432/grade-perform" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic app-db-credentials \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=DATABASE_URL="postgresql://postgres:$DB_PASSWORD@postgres:5432/grade-perform" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: database
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s

      - name: service
        run: |
          kubectl apply -f k8s/
          kubectl set image deploy/grade-perform-api api="$IMAGE"
          kubectl rollout status deploy/grade-perform-api --timeout=180s

      - name: smoke
        run: |
          curl --fail -s http://grade-perform.localhost:30080/health | grep -q 'registry-v'

          R=$(curl --fail -s -X POST http://grade-perform.localhost:30080/v1/predict \
            -H "Content-Type: application/json" -d @sample_request.json)
          echo "$R"

          echo "$R" | python3 -c "import json,sys; p=json.load(sys.stdin); assert 0 <= p['prediction'] <= 5, p"

          sleep 2
          RID=$(echo "$R" | python3 -c "import json,sys; print(json.load(sys.stdin)['request_id'])")
          kubectl exec deploy/postgres -- psql -U postgres -d grade-perform \
            -tc "SELECT count(*) FROM predictions WHERE request_id = '$RID'" | grep -q 1

      - name: diagnosis
        if: failure()

        run: |
          kubectl get pods -o wide
          kubectl describe deploy/grade-perform-api | tail -20
          kubectl logs deploy/grade-perform-api --tail=30 || true

      



  


     

