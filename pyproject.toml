[project]
name = "grade_perform"
version = "0.1.4"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.53.0",
    "mlflow-skinny>=3.16,<4",
    "mlflow>=3.16.1",
    "skops>=0.16.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "locust>=2.46.6",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a real Postgres (set DATABASE_URL)",
]
